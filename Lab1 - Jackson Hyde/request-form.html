<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Tutoring Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5">
        <h1>Request a tutoring session</h1>

        <form action="process-request.php" method="post">

            <!-- course -->
            <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <select id="course" name="course" class="form-select" required>
                    <option value="">Select a course</option>
                    <option value="IS 6465">IS 6465</option>
                    <option value="IS 6495">IS 6495</option>
                    <option value="IS 6570">IS 6570</option>
                </select>
            </div>

            <!-- topic -->
            <div class="mb-3">
                <label for="topic" class="form-label">Topic</label>
                <input id="topic" name="topic" type="text"
                       class="form-control" maxlength="120" required>
            </div>

            <!-- preferred date -->
            <div class="mb-3">
                <label for="preferreddate" class="form-label">Preferred Date</label>
                <input id="preferreddate" name="preferreddate"
                       type="date" class="form-control" required>
            </div>

            <!-- preferred time -->
            <div class="mb-3">
                <label for="preferredtime" class="form-label">Preferred Time</label>
                <select id="preferredtime" name="preferredtime"
                        class="form-select" required>
                    <option value="">Select a time</option>
                    <option value="Morning">Morning</option>
                    <option value="Afternoon">Afternoon</option>
                    <option value="Evening">Evening</option>
                </select>
            </div>

            <button class="btn btn-danger" type="submit">Request Session</button>
        </form>

        <p><a href="index.html">Home</a></p>
    </main>
</body>
</html>
