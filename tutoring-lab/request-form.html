<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tutoring Request</title>
</head>
<body>
    <h1>Request a tutoring session</h1>
    <form action="process-request.php" method="post">
        <p>
            <label for="course">Course</label>
            <select id="course" name="course" required>
                <option value="">Select a course</option>
                <option value="IS 6465">IS 6465</option>
                <option value="IS 6495">IS 6495</option>
                <option value="IS 6570">IS 6570</option>
            </select>
        </p>
        <p>
            <label for="topic">Topic</label>
            <input id="topic" name="topic" type="text" maxlength="120" required>
        </p>
        <p>
            <label for="preferreddate">Preferred date</label>
            <input id="preferreddate" name="preferreddate" type="date" required>
        </p>
        <p>
            <label for="preferredtime">Preferred time</label>
            <select id="preferredtime" name="preferredtime" required>
                <option value="">Select a time</option>
                <option value="Morning">Morning</option>
                <option value="Afternoon">Afternoon</option>
                <option value="Evening">Evening</option>
            </select>
        </p>
        <button type="submit">Request session</button>
    </form>
    <p><a href="lab3.php">Array practice</a></p>
</body>
</html>
